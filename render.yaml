services:
  - type: web
    name: stayinsight-backend
    env: python
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip setuptools wheel
    startCommand: python simple_app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RENDER_PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET
        value: stayinsight-super-secret-key-2026
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
