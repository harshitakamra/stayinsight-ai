services:
  - type: web
    name: stayinsight-backend
    env: python
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && pip install --only-binary=:all: -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./stayinsight.db
      - key: JWT_SECRET
        value: stayinsight-super-secret-key-2026
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
