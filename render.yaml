services:
  - type: web
    name: stayinsight-backend
    env: python
    rootDir: backend
    buildCommand: export PYTHON_VERSION=3.12.0 && python -m pip install --upgrade pip setuptools wheel && python -m pip install --only-binary=:all: --prefer-binary -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./stayinsight.db
      - key: JWT_SECRET
        value: stayinsight-super-secret-key-2026
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
